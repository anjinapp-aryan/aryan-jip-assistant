server:
  port: 8080

spring:
  application:
    name: jip-assistant

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jip_db}
    username: ${DB_USERNAME:jip_user}
    password: ${DB_PASSWORD:jip_pass}
    hikari:
      connection-pool-name: JipPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway manages schema — never use create-drop in prod
    show-sql: false             # Enable temporarily for debugging, never in prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 25    # Batch inserts for performance
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:jip_redis_pass}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ── Kafka ─────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all         # Wait for all replicas (durability)
      retries: 3
    consumer:
      group-id: analytics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual  # Manual ack for reliable processing

  # ── Cache ─────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 1800000   # 30 minutes default TTL

# ── Application Settings ──────────────────────────────────
app:
  jwt:
    # In production: load from env var or secret manager, NEVER hardcode
    secret: ${JWT_SECRET:YXJ5YW4tanVuaW9yLXNlY3JldC1rZXktZm9yLWxvY2FsLWRldi0yNTYtYml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 1 hour

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Swagger ───────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.aryan.jip: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%-5level] %logger{30} - %msg%n"

---
# Docker profile — overrides for container environment
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false
logging:
  level:
    com.aryan.jip: INFO
